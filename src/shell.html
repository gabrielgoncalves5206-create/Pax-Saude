<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" onload="window.paxLeaflet&&window.paxLeaflet()"></script>
<style>
:root{--pet:#4A2252;--pet2:#5E2D68;--teal:#2E8F6E;--teal2:#7CCFB0;--mint:#DCF3E9;--bg:#FAF5F8;--card:#FFFFFF;--ink:#2A1330;--mut:#645069;--line:#EBDDE9;--pk:#6B2468;--pkb:#F6E3EF;--bl:#17624A;--blb:#DCF3E9;--wa:#25D366;--waink:#063B21;--red:#B3261E;--amb:#F2B33D;--r:20px;--sh:0 1px 2px rgba(42,19,48,.06),0 6px 18px rgba(42,19,48,.07)}
html{font-size:100%}html.fs1{font-size:112.5%}html.fs2{font-size:128%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html.legivel body,html.legivel button,html.legivel input,html.legivel select{font-family:'Atkinson Hyperlegible','Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
main{flex:1;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom))}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:3rem 1fr 3rem;align-items:center;gap:.5rem;padding:.5rem .75rem;padding-top:calc(.5rem + env(safe-area-inset-top));background:var(--pet);color:#fff}
.iconbtn{width:3rem;height:3rem;border-radius:1rem;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.iconbtn:hover{background:rgba(255,255,255,.12)}.iconbtn:active{transform:scale(.94)}
.brand{justify-self:center;display:flex;align-items:center;gap:.55rem;font-size:1.22rem;letter-spacing:.01em;white-space:nowrap}
.brand .mk{width:2.15rem;height:2.15rem;border-radius:.8rem;background:linear-gradient(145deg,#fff,#F6E3EF);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brand b{font-weight:800}.brand span{font-weight:500;color:#EBCFF0}
/* ---------- herói da tela inicial ---------- */
.hero{background:linear-gradient(180deg,var(--pet) 0%,var(--pet2) 100%);color:#fff;padding:.4rem 1rem 1.4rem;border-radius:0 0 1.75rem 1.75rem;display:flex;flex-direction:column;gap:.85rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(124,207,176,.35),transparent 70%);pointer-events:none}
.hello{font-size:1.45rem;font-weight:800;margin:0;line-height:1.25}.hello small{display:block;font-size:.9rem;font-weight:500;color:#EBCFF0;margin-top:.15rem}
.chip-o{min-height:2.75rem;display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:.82rem;font-weight:700;text-align:left;max-width:100%;align-self:flex-start;border:1px solid rgba(255,255,255,.18)}
.chip-o span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-o.light{background:var(--pet);border:0}
.search{display:flex;align-items:center;gap:.6rem;min-height:3.4rem;padding:.3rem .35rem .3rem .9rem;border-radius:1.1rem;background:#fff;border:1.5px solid var(--line);color:var(--ink);box-shadow:var(--sh);position:relative;z-index:1}
.search input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:1rem;background:transparent;color:var(--ink);min-height:2.6rem}
.micbtn{width:2.75rem;height:2.75rem;flex:none;border-radius:.85rem;background:var(--teal);display:flex;align-items:center;justify-content:center}
.micbtn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06);opacity:.85}}
/* ---------- cabeçalho de página ---------- */
.phead{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem .2rem}
.back{width:2.9rem;height:2.9rem;flex:none;border-radius:1rem;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.phead h1{margin:0;font-size:1.35rem;line-height:1.25;font-weight:800}.phead p{margin:.1rem 0 0;font-size:.85rem;color:var(--mut)}
/* ---------- base ---------- */
.sec{padding:1.1rem 1rem 0;display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;align-items:center;gap:.6rem}.between{justify-content:space-between}.col{display:flex;flex-direction:column}.wrap{flex-wrap:wrap}
.h2{margin:0;font-size:1.12rem;font-weight:800;line-height:1.3}.h3{margin:0;font-size:1rem;font-weight:800}
.mut{color:var(--mut)}.sm{font-size:.8rem;line-height:1.35}.p{margin:0;font-size:.92rem;line-height:1.5}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{color:var(--pet2);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.card{display:flex;flex-direction:column;gap:.75rem;padding:1rem;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:800;padding:.28rem .6rem;border-radius:999px;background:var(--mint);color:#0A5A50;white-space:nowrap}
.tag.off{background:#FBE9E8;color:#8E1F18}.tag.gray{background:#F3EAF2;color:#33484D}.tag.warn{background:#FFF1D6;color:#7A4A0E}.tag.blue{background:var(--blb);color:var(--bl)}.tag.star{background:#FFF4D6;color:#7A4A0E}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:.8rem;color:var(--mut)}
.info{display:flex;gap:.6rem;padding:.8rem .9rem;border-radius:1rem;background:var(--mint);font-size:.85rem;line-height:1.45;color:#0A4B44}
.info.warn{background:#FFF4DE;color:#5E3B08}.info.red{background:#FBE9E8;color:#7D1B15}
.empty{padding:1.5rem 1rem;border-radius:var(--r);background:#fff;border:1.5px dashed var(--line);text-align:center;color:var(--mut);font-size:.92rem;line-height:1.5}
.btn{min-height:3rem;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.55rem 1rem;border-radius:.95rem;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:.92rem;color:var(--ink);text-align:center;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pet);border-color:var(--pet);color:#fff}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--waink)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}.btn.sm{min-height:2.6rem;font-size:.82rem;flex:none;padding:.4rem .8rem}
.acts{display:flex;gap:.55rem;align-items:stretch}
.round{width:3rem;height:3rem;flex:none;border-radius:1rem;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.round.wa{background:var(--wa);border-color:var(--wa)}
/* ---------- cartões grandes (cubos) ---------- */
.cubes{display:flex;flex-direction:column;gap:.8rem}
.cube{position:relative;overflow:hidden;width:100%;min-height:8.2rem;display:flex;align-items:center;gap:1rem;padding:1.15rem 1.1rem;border-radius:1.6rem;text-align:left;background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh);transition:transform .15s,box-shadow .2s}
.cube:hover{box-shadow:0 10px 28px rgba(42,19,48,.12)}.cube:active{transform:scale(.985)}
.cube .ic{width:4rem;height:4rem;flex:none;border-radius:1.25rem;display:flex;align-items:center;justify-content:center}
.cube .tx{flex:1;display:flex;flex-direction:column;gap:.25rem;min-width:0;position:relative;z-index:1}
.cube .t{font-size:1.5rem;font-weight:800;line-height:1.15}.cube .d{font-size:.88rem;line-height:1.4;color:var(--mut);font-weight:600}
.cube .n{align-self:flex-start;margin-top:.2rem}
.cube .bgic{position:absolute;right:-18px;bottom:-22px;opacity:.09;pointer-events:none}
.cube.pink{background:var(--pkb);border-color:#E9C4DD}.cube.pink .t{color:var(--pk)}.cube.pink .ic{background:#fff}
.cube.blue{background:var(--blb);border-color:#B3E0CD}.cube.blue .t{color:var(--bl)}.cube.blue .ic{background:#fff}
.cube.plain .ic{background:var(--mint)}
.cube.hero2{min-height:10rem}.cube.hero2 .t{font-size:1.75rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.duo .cube{flex-direction:column;align-items:flex-start;min-height:10.5rem}
.duo .cube .t{font-size:1.45rem}
/* ---------- atalhos ---------- */
.hscroll{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.15rem 1rem .6rem;margin:0 -1rem;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}.hscroll>*{scroll-snap-align:start;flex:none}
.short{width:5.6rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-size:.76rem;font-weight:700;text-align:center;line-height:1.2}
.short i{width:3.6rem;height:3.6rem;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:transform .15s}
.short:active i{transform:scale(.92)}
.mini{width:15rem;display:flex;flex-direction:column;border-radius:1.2rem;background:#fff;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh);text-align:left}
.mini .bd{padding:.7rem .8rem .8rem;display:flex;flex-direction:column;gap:.3rem}
.mini b{font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- capas, fotos e mapa-miniatura ---------- */
.cover{position:relative;overflow:hidden;width:100%;background:#DCE8E6;display:block;border-radius:1rem}
.cover img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .tiles{position:absolute;left:50%;top:50%;width:0;height:0}
.cover .tiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.cover .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cover .bdg{position:absolute;left:.6rem;top:.6rem;font-size:.66rem;font-weight:800;letter-spacing:.05em;background:rgba(42,19,48,.82);color:#fff;padding:.3rem .55rem;border-radius:999px}
.cover .src{position:absolute;right:.5rem;bottom:.45rem;font-size:.6rem;font-weight:700;background:rgba(255,255,255,.88);color:#33484D;padding:.15rem .4rem;border-radius:.4rem}
.cover .st{position:absolute;left:.6rem;bottom:.6rem}
.gallery{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery>.cover{flex:none;width:100%;scroll-snap-align:center;border-radius:0}
.dots{display:flex;gap:.3rem;justify-content:center;position:absolute;bottom:.7rem;left:0;right:0;pointer-events:none}
.dots i{width:.45rem;height:.45rem;border-radius:50%;background:rgba(255,255,255,.6)}.dots i.on{background:#fff;width:1.2rem;border-radius:999px}
/* ---------- cartão de local ---------- */
.pcard{display:flex;flex-direction:column;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.pcard .open{display:flex;flex-direction:column;text-align:left;width:100%}
.pcard .cover{border-radius:0}
.pcard .bd{padding:.85rem 1rem .4rem;display:flex;flex-direction:column;gap:.4rem}
.pcard .nm{font-size:1.05rem;font-weight:800;line-height:1.3}
.pcard .acts{padding:.5rem 1rem 1rem}
.grid{display:flex;flex-direction:column;gap:.9rem}
/* ---------- listas ---------- */
.lrow{display:flex;align-items:center;gap:.75rem;padding:.85rem 0;border-bottom:1px solid #F3EAF2;width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
.lic{width:2.75rem;height:2.75rem;flex:none;border-radius:.9rem;display:flex;align-items:center;justify-content:center;background:var(--mint)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{display:flex;flex-direction:column;gap:.45rem;padding:.95rem;border-radius:1.2rem;background:#fff;border:1.5px solid var(--line);text-align:left;box-shadow:var(--sh);transition:transform .15s;min-height:8.2rem}
.tile:active{transform:scale(.97)}.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:6rem}
.tile b{font-size:1rem;line-height:1.25}.tile .lic{width:2.6rem;height:2.6rem}
/* ---------- controles ---------- */
.seg{display:flex;gap:.3rem;padding:.3rem;border-radius:1rem;background:#EFE4EE}
.seg button{flex:1;min-height:2.6rem;border-radius:.75rem;font-size:.8rem;font-weight:800;color:#33484D;padding:0 .4rem}
.seg button[aria-pressed="true"]{background:#fff;color:var(--pet);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chips{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin:0 -1rem;padding:0 1rem}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:2.5rem;padding:0 .95rem;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:.82rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--pet);border-color:var(--pet);color:#fff}
.kv{display:flex;justify-content:space-between;gap:1rem;font-size:.88rem;padding:.55rem 0;border-bottom:1px solid #F3EAF2}.kv:last-child{border-bottom:0}
.mapwrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#E6EEEE;position:relative}
.leaf{width:100%}
/* ---------- avaliação e redes ---------- */
.rate{display:flex;align-items:center;gap:.9rem}
.rate .big{font-size:2.4rem;font-weight:800;line-height:1;color:var(--ink)}
.stars{display:flex;gap:2px}
.soc{display:flex;align-items:center;gap:.8rem;padding:.75rem;border-radius:1.1rem;border:1.5px solid var(--line);background:#fff;width:100%;text-align:left;transition:transform .12s}
.soc:active{transform:scale(.98)}
.soc .si{width:2.9rem;height:2.9rem;border-radius:.95rem;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.soc.hero{border:0;color:#fff;min-height:4.4rem}
.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.fb{background:#1877F2}.li{background:#0A66C2}.yt{background:#FF0000}.site{background:var(--pet)}.gm{background:#fff;border:1.5px solid var(--line)}.dc{background:#00C3A5}
/* ---------- rota ---------- */
.rt-field{display:flex;align-items:center;gap:.75rem;padding:.75rem .9rem;border-radius:1rem;background:#fff;border:1.5px solid var(--line);width:100%;text-align:left;min-height:3.9rem}
.dot{width:.85rem;height:.85rem;border-radius:50%;flex:none}
.mode{display:flex;align-items:center;gap:.5rem;padding:.4rem;border-radius:1.1rem;background:#fff;border:1.5px solid var(--line)}
.mode.sel{border-color:var(--pet);box-shadow:0 0 0 3px rgba(74,34,82,.14)}
.modebtn{flex:1;display:flex;align-items:center;gap:.7rem;padding:.4rem;text-align:left;min-width:0}
.modebtn .t{font-weight:800;font-size:1rem;color:var(--pet);white-space:nowrap}
.gbtn{flex:none;min-height:2.6rem;padding:0 .8rem;border-radius:.8rem;border:1.5px solid var(--line);display:flex;align-items:center;font-size:.78rem;font-weight:800}
/* ---------- navegação inferior ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:.45rem .5rem calc(.55rem + env(safe-area-inset-bottom));background:var(--pet);border-top:0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.7rem;font-weight:700;color:#E6D2EB;min-height:3.4rem}
.nav .bub{width:3.4rem;height:2.1rem;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .25s}
.nav button[aria-current="page"]{color:#fff}
.nav button[aria-current="page"] .bub{background:var(--teal);transform:translateY(-1px)}
.nav .plus{width:3.6rem;height:3.6rem;border-radius:1.3rem;margin-top:-1.6rem;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .2s}
.nav .mid:active .plus{transform:scale(.92)}
.nav .mid[aria-current="page"] .plus{box-shadow:0 0 0 4px rgba(46,143,110,.3),0 8px 20px rgba(11,79,92,.35)}
body.cad .nav,body.cad .fab{display:none}
body.cad main{padding-bottom:2rem}
/* ---------- barra de ação fixa ---------- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4.6rem + env(safe-area-inset-bottom));width:calc(100% - 1.5rem);max-width:536px;z-index:35;display:flex;gap:.55rem;padding:.55rem;border-radius:1.3rem;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 10px 30px rgba(42,19,48,.18)}
.has-bar main{padding-bottom:calc(11rem + env(safe-area-inset-bottom))}
.fab{position:fixed;right:1rem;bottom:calc(5.6rem + env(safe-area-inset-bottom));z-index:45;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--amb);color:#3A2600;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.has-bar .fab{bottom:calc(10.4rem + env(safe-area-inset-bottom))}
/* ---------- menu lateral ---------- */
.drawer-bg{position:fixed;inset:0;z-index:60;background:rgba(30,10,36,.45);animation:fade .25s ease}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(88vw,22rem);z-index:61;background:#fff;display:flex;flex-direction:column;animation:slide .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.drawer .dh{background:linear-gradient(160deg,var(--pet),var(--pet2));color:#fff;padding:calc(1.2rem + env(safe-area-inset-top)) 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.drawer .it{display:flex;align-items:center;gap:.85rem;padding:.8rem 1.1rem;width:100%;text-align:left;min-height:3.6rem}
.drawer .it:hover{background:#F8F0F7}
.drawer .it b{font-size:.95rem;display:block}.drawer .it small{font-size:.76rem;color:var(--mut);display:block;line-height:1.3}
.drawer .grp{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--mut);padding:1rem 1.1rem .3rem}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* ---------- folhas (modais) ---------- */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(30,10,36,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:.6rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.85rem;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:2.8rem;height:.3rem;border-radius:999px;background:#CFDADA;align-self:center}

.acao.co{background:linear-gradient(135deg,#17624A,#2E8F6E);color:#fff;box-shadow:0 10px 22px rgba(23,98,74,.28)}

.selo{display:flex;align-items:center;gap:.9rem;background:#DCF3E9;border-radius:1.3rem;padding:.9rem 1rem}
.selo-n{font-size:2.3rem;font-weight:900;color:#17624A;line-height:.85;display:flex;flex-direction:column;align-items:center;flex:none}.selo-n small{font-size:.8rem;font-weight:800}
.selo span:last-child{display:flex;flex-direction:column;gap:.15rem}.selo b{color:#0E3D2E}.selo small{font-size:.82rem;color:#2C5A49}
.aviso-conf{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:#F6E3EF;border:2px solid #E3B8D8;border-radius:1.2rem;padding:.8rem 1rem}
.aviso-conf>span:nth-child(2){flex:1;display:flex;flex-direction:column}.aviso-conf small{color:var(--mut)}
.ac-ic{width:2.6rem;height:2.6rem;border-radius:.9rem;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.passos{display:flex;align-items:center;gap:.35rem;margin-bottom:1rem}.passos i{height:.4rem;flex:1;max-width:3.2rem;border-radius:999px;background:var(--line)}.passos i.on{background:#2E8F6E}.passos span{margin-left:.5rem}
.fluxo .h2{margin-top:0}.fluxo .btn.big{width:100%;min-height:3.4rem;font-size:1.05rem;margin-top:1.1rem}
.fluxo .btn[disabled]{opacity:.45}
.foto-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;background:linear-gradient(135deg,#4A2252,#6B2468);color:#fff;border-radius:1.4rem;min-height:11rem;cursor:pointer;text-align:center}
.foto-btn b{font-size:1.1rem}.foto-btn small{opacity:.85}
.foto-prev{display:grid;gap:.6rem}.foto-prev img{width:100%;max-height:22rem;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:1.2rem}
.semfoto{margin-top:1rem;background:#fff;border:1px solid var(--line);border-radius:1.2rem;padding:.8rem 1rem}.semfoto summary{font-weight:800;cursor:pointer}
.exsel{display:flex;flex-direction:column;gap:.35rem;margin-top:.6rem;max-height:18rem;overflow:auto}
.exo{display:flex;align-items:center;gap:.5rem;text-align:left;padding:.65rem .8rem;border-radius:.9rem;border:1px solid var(--line);background:#FAF5F8;min-height:2.9rem}.exo.on{border-color:#2E8F6E;background:#DCF3E9;color:#0E3D2E;font-weight:700}
.esps{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.espb{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1rem .6rem;border-radius:1.3rem;background:var(--bg);color:#fff;border:3px solid transparent;text-align:center}
.espb.on{border-color:#7CCFB0;box-shadow:0 0 0 3px #fff inset}
.espb-ic{width:4.6rem;height:4.6rem;border-radius:1.2rem;background:#fff;display:flex;align-items:center;justify-content:center}.espb-ic svg{width:3.6rem;height:3.6rem}
.pag-cartao .ct{box-shadow:0 10px 22px rgba(42,19,48,.2)}
.cob{margin:.7rem 0 0;font-weight:700;font-size:.92rem;padding:.55rem .8rem;border-radius:.9rem}.cob.ok{background:#DCF3E9;color:#0E3D2E}.cob.warn{background:#FFF4D6;color:#6B4E00}
.opts{display:grid;gap:.5rem;margin-top:.9rem}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.8rem 1rem;border-radius:1.1rem;border:2px solid var(--line);background:#fff;min-height:3.6rem}
.opt svg{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid #C9B8CC;color:transparent;padding:.1rem;flex:none}
.opt.on{border-color:#2E8F6E;background:#F2FBF7}.opt.on svg{background:#2E8F6E;border-color:#2E8F6E;color:#fff}
.opt span{display:flex;flex-direction:column}.opt small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip2{padding:.75rem 1.1rem;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;min-height:3rem}.chip2.on{background:#4A2252;border-color:#4A2252;color:#fff}
.resumo .rl{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-top:1px solid var(--line)}.resumo .rl:first-child{border-top:0}.resumo .rl span{color:var(--mut)}.resumo .rl b{text-align:right}
.ok-tela{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.8rem;padding-top:1.5rem}
.ok-ic{width:6rem;height:6rem;border-radius:50%;background:#7CCFB0;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .6rem #DCF3E9}
.ok-tela .btn{width:100%}
.card.ag{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.8rem}.card.ag.ok{border-left:5px solid #2E8F6E}.card.ag.pend{border-left:5px solid #E1A422}
.ag-dt{font-size:1.1rem;color:#17624A;text-transform:capitalize}
.ag-bts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.4rem}.ag-bts .btn:last-child{grid-column:1/-1}
.conf{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem;padding:.8rem;border-radius:1rem;background:#FAF5F8}
body.pedv{background:#f4f4f4;font-family:system-ui,sans-serif;margin:0}.pedv-w{max-width:900px;margin:0 auto;padding:1.2rem}.pedv-w h1{font-size:1.2rem}.pedv-w img{width:100%;border-radius:.6rem;background:#fff;margin:.6rem 0}.pedv-w a{display:inline-block;padding:.7rem 1rem;background:#4A2252;color:#fff;border-radius:.6rem;text-decoration:none}
</style>
