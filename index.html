<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" onload="window.paxLeaflet&&window.paxLeaflet()"></script>
<style>
:root{--pet:#0B4F5C;--pet2:#0E6470;--teal:#14A39A;--teal2:#34C3B5;--mint:#E2F4F1;--bg:#F1F6F6;--card:#FFFFFF;--ink:#0C2329;--mut:#4A6066;--line:#DAE5E5;--pk:#B02A62;--pkb:#FDE8F0;--bl:#1C5BA8;--blb:#E5EEFC;--wa:#25D366;--waink:#063B21;--red:#B3261E;--amb:#F2B33D;--r:20px;--sh:0 1px 2px rgba(12,35,41,.06),0 6px 18px rgba(12,35,41,.07)}
html{font-size:100%}html.fs1{font-size:112.5%}html.fs2{font-size:128%}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html.legivel body,html.legivel button,html.legivel input,html.legivel select{font-family:'Atkinson Hyperlegible','Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}
main{flex:1;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom))}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:3rem 1fr 3rem;align-items:center;gap:.5rem;padding:.5rem .75rem;padding-top:calc(.5rem + env(safe-area-inset-top));background:var(--pet);color:#fff}
.iconbtn{width:3rem;height:3rem;border-radius:1rem;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.iconbtn:hover{background:rgba(255,255,255,.12)}.iconbtn:active{transform:scale(.94)}
.brand{justify-self:center;display:flex;align-items:center;gap:.55rem;font-size:1.22rem;letter-spacing:.01em;white-space:nowrap}
.brand .mk{width:2.15rem;height:2.15rem;border-radius:.8rem;background:linear-gradient(145deg,#fff,#DDF5F1);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brand b{font-weight:800}.brand span{font-weight:500;color:#BDEDE6}
/* ---------- herói da tela inicial ---------- */
.hero{background:linear-gradient(180deg,var(--pet) 0%,var(--pet2) 100%);color:#fff;padding:.4rem 1rem 1.4rem;border-radius:0 0 1.75rem 1.75rem;display:flex;flex-direction:column;gap:.85rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(52,195,181,.35),transparent 70%);pointer-events:none}
.hello{font-size:1.45rem;font-weight:800;margin:0;line-height:1.25}.hello small{display:block;font-size:.9rem;font-weight:500;color:#BDEDE6;margin-top:.15rem}
.chip-o{min-height:2.75rem;display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:.82rem;font-weight:700;text-align:left;max-width:100%;align-self:flex-start;border:1px solid rgba(255,255,255,.18)}
.chip-o span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-o.light{background:var(--pet);border:0}
.search{display:flex;align-items:center;gap:.6rem;min-height:3.4rem;padding:.3rem .35rem .3rem .9rem;border-radius:1.1rem;background:#fff;border:1.5px solid var(--line);color:var(--ink);box-shadow:var(--sh);position:relative;z-index:1}
.search input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:1rem;background:transparent;color:var(--ink);min-height:2.6rem}
.micbtn{width:2.75rem;height:2.75rem;flex:none;border-radius:.85rem;background:var(--teal);display:flex;align-items:center;justify-content:center}
.micbtn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06);opacity:.85}}
/* ---------- cabeçalho de página ---------- */
.phead{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem .2rem}
.back{width:2.9rem;height:2.9rem;flex:none;border-radius:1rem;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.phead h1{margin:0;font-size:1.35rem;line-height:1.25;font-weight:800}.phead p{margin:.1rem 0 0;font-size:.85rem;color:var(--mut)}
/* ---------- base ---------- */
.sec{padding:1.1rem 1rem 0;display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;align-items:center;gap:.6rem}.between{justify-content:space-between}.col{display:flex;flex-direction:column}.wrap{flex-wrap:wrap}
.h2{margin:0;font-size:1.12rem;font-weight:800;line-height:1.3}.h3{margin:0;font-size:1rem;font-weight:800}
.mut{color:var(--mut)}.sm{font-size:.8rem;line-height:1.35}.p{margin:0;font-size:.92rem;line-height:1.5}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk{color:var(--pet2);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.card{display:flex;flex-direction:column;gap:.75rem;padding:1rem;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:800;padding:.28rem .6rem;border-radius:999px;background:var(--mint);color:#0A5A50;white-space:nowrap}
.tag.off{background:#FBE9E8;color:#8E1F18}.tag.gray{background:#EDF2F2;color:#33484D}.tag.warn{background:#FFF1D6;color:#7A4A0E}.tag.blue{background:var(--blb);color:var(--bl)}.tag.star{background:#FFF4D6;color:#7A4A0E}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-size:.8rem;color:var(--mut)}
.info{display:flex;gap:.6rem;padding:.8rem .9rem;border-radius:1rem;background:var(--mint);font-size:.85rem;line-height:1.45;color:#0A4B44}
.info.warn{background:#FFF4DE;color:#5E3B08}.info.red{background:#FBE9E8;color:#7D1B15}
.empty{padding:1.5rem 1rem;border-radius:var(--r);background:#fff;border:1.5px dashed var(--line);text-align:center;color:var(--mut);font-size:.92rem;line-height:1.5}
.btn{min-height:3rem;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.55rem 1rem;border-radius:.95rem;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:.92rem;color:var(--ink);text-align:center;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pet);border-color:var(--pet);color:#fff}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--waink)}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}.btn.sm{min-height:2.6rem;font-size:.82rem;flex:none;padding:.4rem .8rem}
.acts{display:flex;gap:.55rem;align-items:stretch}
.round{width:3rem;height:3rem;flex:none;border-radius:1rem;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.round.wa{background:var(--wa);border-color:var(--wa)}
/* ---------- cartões grandes (cubos) ---------- */
.cubes{display:flex;flex-direction:column;gap:.8rem}
.cube{position:relative;overflow:hidden;width:100%;min-height:8.2rem;display:flex;align-items:center;gap:1rem;padding:1.15rem 1.1rem;border-radius:1.6rem;text-align:left;background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh);transition:transform .15s,box-shadow .2s}
.cube:hover{box-shadow:0 10px 28px rgba(12,35,41,.12)}.cube:active{transform:scale(.985)}
.cube .ic{width:4rem;height:4rem;flex:none;border-radius:1.25rem;display:flex;align-items:center;justify-content:center}
.cube .tx{flex:1;display:flex;flex-direction:column;gap:.25rem;min-width:0;position:relative;z-index:1}
.cube .t{font-size:1.5rem;font-weight:800;line-height:1.15}.cube .d{font-size:.88rem;line-height:1.4;color:var(--mut);font-weight:600}
.cube .n{align-self:flex-start;margin-top:.2rem}
.cube .bgic{position:absolute;right:-18px;bottom:-22px;opacity:.09;pointer-events:none}
.cube.pink{background:var(--pkb);border-color:#F6CBDB}.cube.pink .t{color:var(--pk)}.cube.pink .ic{background:#fff}
.cube.blue{background:var(--blb);border-color:#C9DBF7}.cube.blue .t{color:var(--bl)}.cube.blue .ic{background:#fff}
.cube.plain .ic{background:var(--mint)}
.cube.hero2{min-height:10rem}.cube.hero2 .t{font-size:1.75rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.duo .cube{flex-direction:column;align-items:flex-start;min-height:10.5rem}
.duo .cube .t{font-size:1.45rem}
/* ---------- atalhos ---------- */
.hscroll{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.15rem 1rem .6rem;margin:0 -1rem;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}.hscroll>*{scroll-snap-align:start;flex:none}
.short{width:5.6rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-size:.76rem;font-weight:700;text-align:center;line-height:1.2}
.short i{width:3.6rem;height:3.6rem;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:transform .15s}
.short:active i{transform:scale(.92)}
.mini{width:15rem;display:flex;flex-direction:column;border-radius:1.2rem;background:#fff;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh);text-align:left}
.mini .bd{padding:.7rem .8rem .8rem;display:flex;flex-direction:column;gap:.3rem}
.mini b{font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- capas, fotos e mapa-miniatura ---------- */
.cover{position:relative;overflow:hidden;width:100%;background:#DCE8E6;display:block;border-radius:1rem}
.cover img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .tiles{position:absolute;left:50%;top:50%;width:0;height:0}
.cover .tiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.cover .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cover .bdg{position:absolute;left:.6rem;top:.6rem;font-size:.66rem;font-weight:800;letter-spacing:.05em;background:rgba(12,35,41,.82);color:#fff;padding:.3rem .55rem;border-radius:999px}
.cover .src{position:absolute;right:.5rem;bottom:.45rem;font-size:.6rem;font-weight:700;background:rgba(255,255,255,.88);color:#33484D;padding:.15rem .4rem;border-radius:.4rem}
.cover .st{position:absolute;left:.6rem;bottom:.6rem}
.gallery{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery>.cover{flex:none;width:100%;scroll-snap-align:center;border-radius:0}
.dots{display:flex;gap:.3rem;justify-content:center;position:absolute;bottom:.7rem;left:0;right:0;pointer-events:none}
.dots i{width:.45rem;height:.45rem;border-radius:50%;background:rgba(255,255,255,.6)}.dots i.on{background:#fff;width:1.2rem;border-radius:999px}
/* ---------- cartão de local ---------- */
.pcard{display:flex;flex-direction:column;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.pcard .open{display:flex;flex-direction:column;text-align:left;width:100%}
.pcard .cover{border-radius:0}
.pcard .bd{padding:.85rem 1rem .4rem;display:flex;flex-direction:column;gap:.4rem}
.pcard .nm{font-size:1.05rem;font-weight:800;line-height:1.3}
.pcard .acts{padding:.5rem 1rem 1rem}
.grid{display:flex;flex-direction:column;gap:.9rem}
/* ---------- listas ---------- */
.lrow{display:flex;align-items:center;gap:.75rem;padding:.85rem 0;border-bottom:1px solid #EDF2F2;width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
.lic{width:2.75rem;height:2.75rem;flex:none;border-radius:.9rem;display:flex;align-items:center;justify-content:center;background:var(--mint)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{display:flex;flex-direction:column;gap:.45rem;padding:.95rem;border-radius:1.2rem;background:#fff;border:1.5px solid var(--line);text-align:left;box-shadow:var(--sh);transition:transform .15s;min-height:8.2rem}
.tile:active{transform:scale(.97)}.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:6rem}
.tile b{font-size:1rem;line-height:1.25}.tile .lic{width:2.6rem;height:2.6rem}
/* ---------- controles ---------- */
.seg{display:flex;gap:.3rem;padding:.3rem;border-radius:1rem;background:#E3ECEC}
.seg button{flex:1;min-height:2.6rem;border-radius:.75rem;font-size:.8rem;font-weight:800;color:#33484D;padding:0 .4rem}
.seg button[aria-pressed="true"]{background:#fff;color:var(--pet);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chips{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin:0 -1rem;padding:0 1rem}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:2.5rem;padding:0 .95rem;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:.82rem;font-weight:700}
.chip[aria-pressed="true"]{background:var(--pet);border-color:var(--pet);color:#fff}
.kv{display:flex;justify-content:space-between;gap:1rem;font-size:.88rem;padding:.55rem 0;border-bottom:1px solid #EDF2F2}.kv:last-child{border-bottom:0}
.mapwrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#E6EEEE;position:relative}
.leaf{width:100%}
/* ---------- avaliação e redes ---------- */
.rate{display:flex;align-items:center;gap:.9rem}
.rate .big{font-size:2.4rem;font-weight:800;line-height:1;color:var(--ink)}
.stars{display:flex;gap:2px}
.soc{display:flex;align-items:center;gap:.8rem;padding:.75rem;border-radius:1.1rem;border:1.5px solid var(--line);background:#fff;width:100%;text-align:left;transition:transform .12s}
.soc:active{transform:scale(.98)}
.soc .si{width:2.9rem;height:2.9rem;border-radius:.95rem;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.soc.hero{border:0;color:#fff;min-height:4.4rem}
.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.fb{background:#1877F2}.li{background:#0A66C2}.yt{background:#FF0000}.site{background:var(--pet)}.gm{background:#fff;border:1.5px solid var(--line)}.dc{background:#00C3A5}
/* ---------- rota ---------- */
.rt-field{display:flex;align-items:center;gap:.75rem;padding:.75rem .9rem;border-radius:1rem;background:#fff;border:1.5px solid var(--line);width:100%;text-align:left;min-height:3.9rem}
.dot{width:.85rem;height:.85rem;border-radius:50%;flex:none}
.mode{display:flex;align-items:center;gap:.5rem;padding:.4rem;border-radius:1.1rem;background:#fff;border:1.5px solid var(--line)}
.mode.sel{border-color:var(--pet);box-shadow:0 0 0 3px rgba(11,79,92,.12)}
.modebtn{flex:1;display:flex;align-items:center;gap:.7rem;padding:.4rem;text-align:left;min-width:0}
.modebtn .t{font-weight:800;font-size:1rem;color:var(--pet);white-space:nowrap}
.gbtn{flex:none;min-height:2.6rem;padding:0 .8rem;border-radius:.8rem;border:1.5px solid var(--line);display:flex;align-items:center;font-size:.78rem;font-weight:800}
/* ---------- navegação inferior ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:.45rem .5rem calc(.55rem + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.7rem;font-weight:700;color:#4A6066;min-height:3.4rem}
.nav .bub{width:3.4rem;height:2.1rem;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .25s,transform .25s}
.nav button[aria-current="page"]{color:var(--pet)}
.nav button[aria-current="page"] .bub{background:var(--teal);transform:translateY(-1px)}
.nav .plus{width:3.6rem;height:3.6rem;border-radius:1.3rem;margin-top:-1.6rem;background:linear-gradient(145deg,var(--teal),var(--pet));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(11,79,92,.35);transition:transform .2s}
.nav .mid:active .plus{transform:scale(.92)}
.nav .mid[aria-current="page"] .plus{box-shadow:0 0 0 4px rgba(20,163,154,.3),0 8px 20px rgba(11,79,92,.35)}
/* ---------- barra de ação fixa ---------- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4.6rem + env(safe-area-inset-bottom));width:calc(100% - 1.5rem);max-width:536px;z-index:35;display:flex;gap:.55rem;padding:.55rem;border-radius:1.3rem;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 10px 30px rgba(12,35,41,.18)}
.has-bar main{padding-bottom:calc(11rem + env(safe-area-inset-bottom))}
.fab{position:fixed;right:1rem;bottom:calc(5.6rem + env(safe-area-inset-bottom));z-index:45;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--amb);color:#3A2600;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.has-bar .fab{bottom:calc(10.4rem + env(safe-area-inset-bottom))}
/* ---------- menu lateral ---------- */
.drawer-bg{position:fixed;inset:0;z-index:60;background:rgba(6,25,29,.45);animation:fade .25s ease}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(88vw,22rem);z-index:61;background:#fff;display:flex;flex-direction:column;animation:slide .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.drawer .dh{background:linear-gradient(160deg,var(--pet),var(--pet2));color:#fff;padding:calc(1.2rem + env(safe-area-inset-top)) 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.drawer .it{display:flex;align-items:center;gap:.85rem;padding:.8rem 1.1rem;width:100%;text-align:left;min-height:3.6rem}
.drawer .it:hover{background:#F3F8F8}
.drawer .it b{font-size:.95rem;display:block}.drawer .it small{font-size:.76rem;color:var(--mut);display:block;line-height:1.3}
.drawer .grp{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--mut);padding:1rem 1.1rem .3rem}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* ---------- folhas (modais) ---------- */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(6,25,29,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:.6rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.85rem;animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:2.8rem;height:.3rem;border-radius:999px;background:#CFDADA;align-self:center}

const FOTOS=LS.get('fotos3',{});
function fonteFoto(p,u){if(p.fotoCred&&u===p.foto)return p.fotoCred;if(/wikimedia/.test(u))return'Wikimedia Commons';if(p.fotoRede)return'Imagem da rede';return'Site oficial'}

const FQ=[];let FQrun=0;
function pedirFotos(p){if(!p||isOnline(p)||p.la==null||FOTOS[p.id]||p._fq)return;p._fq=1;FQ.push(p);bombaFQ()}
function bombaFQ(){while(FQrun<2&&FQ.length){const p=FQ.shift();FQrun++;buscaFotos(p).catch(()=>{}).then(()=>{FQrun--;bombaFQ()})}}
async function buscaFotos(p){const out=[];let ok=false;if(typeof fetch!=='function')return;
 if(CFG.mapillary){for(const d of [.0005,.0013]){if(out.length)break;try{const r=await fetch(`https://graph.mapillary.com/images?access_token=${enc(CFG.mapillary)}&fields=id,thumb_1024_url,captured_at,geometry&bbox=${p.lo-d},${p.la-d},${p.lo+d},${p.la+d}&limit=6`);if(r.ok){ok=true;const j=await r.json();(j.data||[]).filter(x=>x.thumb_1024_url).sort((a,b)=>{const g=x=>x.geometry&&x.geometry.coordinates?km(p,{la:x.geometry.coordinates[1],lo:x.geometry.coordinates[0]}):1;return g(a)-g(b)}).slice(0,3).forEach(x=>out.push({u:x.thumb_1024_url,src:'Mapillary',link:'https://www.mapillary.com/app/?pKey='+x.id,rua:1}))}}catch(e){}}}
 try{const r=await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${p.la}%7C${p.lo}&ggsradius=120&ggslimit=10&ggsnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*`);if(r.ok){ok=true;const j=await r.json();const pg=j.query&&j.query.pages?Object.values(j.query.pages):[];pg.filter(x=>/\.(jpe?g|png|webp)$/i.test(x.title)&&!/map|mapa|logo|bandeira|flag/i.test(x.title)&&x.imageinfo&&x.imageinfo[0]).sort((a,b)=>(a.index||0)-(b.index||0)).slice(0,3).forEach(x=>out.push({u:x.imageinfo[0].thumburl||x.imageinfo[0].url,src:'Wikimedia Commons',link:x.imageinfo[0].descriptionurl}))}}catch(e){}
 if(ok){FOTOS[p.id]=out;LS.set('fotos3',FOTOS)}else p._fq=0;
 if(out.length)atualizaCapas(p)}

/* miniatura de mapa (OpenStreetMap/CARTO) centrada no endereço */
function tileXY(la,lo,z){const n=2**z;const r=la*Math.PI/180;return[(lo+180)/360*n,(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n]}
function mapThumb(p,hx,hy){if(p.la==null)return`<span style="position:absolute;inset:0;background:linear-gradient(135deg,${CATS[p.c].cor},#0B4F5C);display:flex;align-items:center;justify-content:center">${I[IC_CAT[p.c]]('#fff',54,1.6)}</span>`;
 const z=16,[x,y]=tileXY(p.la,p.lo,z),px=x*256,py=y*256;let h='';
 for(let tx=Math.floor((px-hx)/256);tx<=Math.floor((px+hx)/256);tx++)for(let ty=Math.floor((py-hy)/256);ty<=Math.floor((py+hy)/256);ty++)h+=`<img src="https://${'abcd'[(tx+ty)&3]}.basemaps.cartocdn.com/rastertiles/voyager/${z}/${tx}/${ty}.png" style="left:${Math.round(tx*256-px)}px;top:${Math.round(ty*256-py)}px" alt="" loading="lazy">`;
 return `<span class="tiles" aria-hidden="true">${h}</span><span class="pin">${PINSVG(CATS[p.c].cor)}</span>`}
function coverBase(p,h){h=h||'8.5rem';const f=fotosDe(p)[0];const c=CATS[p.c];
 return `<span class="cover" data-cov="${p.id}" data-h="${h}" style="height:${h}">${mapThumb(p,340,150)}${f?`<img class="ph" src="${esc(f.u)}" alt="Foto: ${esc(p.n)}" loading="lazy" referrerpolicy="no-referrer" decoding="async" onerror="var s=this.parentNode.querySelector('.src');if(s)s.textContent='Ilustração Pax';this.remove()">`:''}<span class="bdg">${esc(c.um.toUpperCase())}</span><span class="src">${f?esc(f.src):p.la!=null?'Mapa · OSM/CARTO':'Online'}</span></span>`}
function galeriaBase(p){const fs=fotosDe(p);const sl=fs.map(f=>`<span class="cover" style="height:15rem"><span style="position:absolute;inset:0;background:#DCE8E6"></span><img class="ph" src="${esc(f.u)}" alt="Foto ${f.rua?'de rua perto':'de'} ${esc(p.n)}" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"><a class="src" href="${esc(f.link||'#')}" target="_blank" rel="noopener">${f.rua?'Foto de rua · ':''}${esc(f.src)}</a></span>`);
 if(!isOnline(p))sl.push(`<span class="cover" style="height:15rem">${mapThumb(p,420,180)}<span class="src">Mapa · © OpenStreetMap © CARTO</span></span>`);else sl.push(`<span class="cover" style="height:15rem">${mapThumb(p)}</span>`);
 return `<div class="gallery" id="galsc">${sl.join('')}</div>${sl.length>1?`<div class="dots" id="galdots">${sl.map((x,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}`}
function ligaGaleria(){const g=$('galsc'),d=$('galdots');if(!g||!d)return;g.addEventListener('scroll',()=>{const i=Math.round(g.scrollLeft/Math.max(1,g.clientWidth));[...d.children].forEach((x,k)=>x.classList.toggle('on',k===i))},{passive:true})}

function links(o,d){return `<div class="card"><h2 class="h3">Abrir no app</h2><div class="mapbtns">${btnGmaps(gmaps(o,d,'transit'))}${btnUber(uber(d))}</div></div>`}
async function posRota(){const o=S.origin,d=S.dest;if(!d||o.la==null)return;
 if(d.k==='unidade'){const p=byId(d.id);const la=p.la;await refinar(p);if(S.view!=='rota'||S.dest!==d)return;if(p.la!==la){d.la=p.la;d.lo=p.lo}}
 const res={};await Promise.all(['foot','bike','car'].map(async pf=>{res[pf]=await osrm(pf,o,d)}));
 if(S.view!=='rota'||S.dest!==d)return;
 if(!S.rmode)S.rmode=(res.foot&&res.foot.km<2.5)?'foot':'car';
 ['foot','bike','car'].forEach(pf=>{const r=res[pf],ts=$('rt_'+pf),ss=$('rs_'+pf);if(!ts)return;
  if(r){ts.textContent=fmin(pf==='bike'?r.km/13*60:r.min);ss.textContent=fkm(r.km)+' pelas ruas'+(pf==='car'?' · sem trânsito':'')}
  else{const k=km(o,d)*1.3;ts.textContent='~'+fmin(pf==='foot'?k/4.8*60:pf==='bike'?k/13*60:k*1.08/20*60+5);ss.textContent='estimativa (rota indisponível)'}});
 document.querySelectorAll('.mode').forEach(el=>el.classList.toggle('sel',!!el.querySelector(`[data-k="${S.rmode}"]`)));
 const best=res[S.rmode]||res.car||res.foot;const kmEl=$('rKm'),sub=$('rKmSub');
 if(best&&kmEl){kmEl.textContent=fkm(best.km);sub.textContent='pelas ruas · '+(S.rmode==='foot'?'a pé':S.rmode==='bike'?'de bicicleta':'de carro')}
 else if(sub)sub.textContent='em linha reta (rota real indisponível agora)';
 if(S.rmap==='osm'){matarMapas();const m=novoMapa('mapRota');if(!m)return;const b=[[o.la,o.lo],[d.la,d.lo]];
  window.L.circleMarker([o.la,o.lo],{radius:9,color:'#fff',weight:3,fillColor:'#2563EB',fillOpacity:1}).addTo(m).bindTooltip('Partida');
  window.L.circleMarker([d.la,d.lo],{radius:10,color:'#fff',weight:3,fillColor:'#0B4F5C',fillOpacity:1}).addTo(m).bindTooltip(d.n);
  const r=res[S.rmode];if(r){window.L.polyline(r.geo,{color:'#0B4F5C',weight:5,opacity:.85}).addTo(m);r.geo.forEach(x=>b.push(x))}else window.L.polyline(b,{color:'#0B4F5C',weight:3,dashArray:'6 8'}).addTo(m);
  [estMaisProx(o).e,estMaisProx(d).e].forEach(e=>window.L.circleMarker([e.la,e.lo],{radius:6,color:'#7A4A0E',weight:2,fillColor:'#F2B33D',fillOpacity:1}).addTo(m).bindTooltip(e.n));
  m.fitBounds(b,{padding:[30,30]})}}

async function pontoLivre(alvo,txt){const pt={k:'geo',n:txt,sub:'Localizando…',la:null,lo:null};setPonto(alvo,pt);const g=await geocode(/s(ã|a)o paulo|sp\b/i.test(txt)?txt:txt+', São Paulo');

/* ---- lembretes a partir da mensagem de confirmação ---- */
const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],DIAS=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
function lerConfirmacao(txt){const t=norm(txt);const hoje=new Date();let d=null,m;
 if((m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/))){let y=m[3]?+m[3]:hoje.getFullYear();if(y<100)y+=2000;d=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&d<new Date(hoje.toDateString()))d.setFullYear(y+1)}
 else if((m=t.match(/\b(\d{1,2}) de ([a-z]+)/))&&MESES.indexOf(m[2])>=0){d=new Date(hoje.getFullYear(),MESES.indexOf(m[2]),+m[1]);if(d<new Date(hoje.toDateString()))d.setFullYear(d.getFullYear()+1)}
 else if(/depois de amanha/.test(t)){d=new Date(hoje);d.setDate(d.getDate()+2)}else if(/amanha/.test(t)){d=new Date(hoje);d.setDate(d.getDate()+1)}else if(/\bhoje\b/.test(t))d=new Date(hoje);
 else{const i=DIAS.findIndex(x=>new RegExp('\\b'+x).test(t));if(i>=0){d=new Date(hoje);d.setDate(d.getDate()+((i-hoje.getDay()+7)%7||7))}}
 let hora='';if((m=t.match(/\b(?:as|a partir das|horario:?)\s*(\d{1,2})(?:[:h](\d{2}))?\s*h?/))||(m=t.match(/\b(\d{1,2})[:h](\d{2})\b/))||(m=t.match(/\b(\d{1,2})\s*h\b/)))hora=String(m[1]).padStart(2,'0')+':'+(m[2]||'00');
 const frases=txt.split(/(?<=[.!?\n])\s*/).map(s=>s.trim()).filter(s=>/jejum|preparo|beber|bexiga|suspend|levar|traga|trazer|chegar|anteced|document|pedido|guia|carteirinh|dieta|evitar|nao (comer|tomar)|não (comer|tomar)|acompanhante|roupa/i.test(s));
 return{data:d?d.toISOString().slice(0,10):'',hora,desc:frases.join('\n')}}
function icsData(L){const z=n=>String(n).padStart(2,'0');const[y,mo,da]=L.data.split('-');const[h,mi]=(L.hora||'08:00').split(':');const ini=`${y}${mo}${da}T${z(h)}${z(mi)}00`;const fimD=new Date(+y,+mo-1,+da,+h+1,+mi);const fim=`${fimD.getFullYear()}${z(fimD.getMonth()+1)}${z(fimD.getDate())}T${z(fimD.getHours())}${z(fimD.getMinutes())}00`;return{ini,fim}}
function lembreteGoogle(L){const{ini,fim}=icsData(L);return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(L.titulo)}&dates=${ini}/${fim}&ctz=America/Sao_Paulo&details=${enc(L.desc+'\n\nCriado pelo Pax - Saúde')}&location=${enc(L.end)}`}
function baixarICS(L){const{ini,fim}=icsData(L);const e=s=>String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pax Saude//PT-BR','BEGIN:VEVENT','UID:pax-'+Date.now()+'@pax','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;TZID=America/Sao_Paulo:'+ini,'DTEND;TZID=America/Sao_Paulo:'+fim,'SUMMARY:'+e(L.titulo),'DESCRIPTION:'+e(L.desc),'LOCATION:'+e(L.end),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+e(L.titulo+' amanhã'),'END:VALARM','BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:'+e(L.titulo+' em 2 horas'),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='lembrete-pax.ics';document.body.appendChild(a);a.click();a.remove()}catch(err){toast('Não foi possível gerar o arquivo')}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||S.lendo)return;const a=t.dataset.act;
 if(a==='avaliar')abrirAvaliar(+t.dataset.id);
 else if(a==='avset'){AV.r[t.dataset.k]=t.dataset.v;desenharAv(byId(AV.id))}
 else if(a==='avenviar')enviarAv();
 else if(a==='orc'){ORC={};abrirOrc()}
 else if(a==='orcenviar')orcEnviar(+t.dataset.id)
 else if(a==='sairconta')sairConta()});
/* =====================================================================
   Conta (login por e-mail) para avaliar, faixa e ponto do atendimento inclusivo,
   notas do Google vindas do Supabase
   ===================================================================== */
const APP_URL=location.origin+location.pathname;
let SESSAO=LS.get('sessao',null);
(function(){const h=location.hash||'';if(/access_token=/.test(h)){const q=new URLSearchParams(h.slice(1));SESSAO={at:q.get('access_token'),rt:q.get('refresh_token'),exp:Date.now()+((+q.get('expires_in')||3600)*1000),email:''};
 try{const pl=JSON.parse(atob(SESSAO.at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));SESSAO.email=pl.email||''}catch(e){}LS.set('sessao',SESSAO);try{history.replaceState(history.state,'',APP_URL)}catch(e){}setTimeout(()=>toast('Conta conectada'+(SESSAO.email?': '+SESSAO.email:'')+'. Você já pode avaliar locais.'),900)}})();
async function tokenValido(){if(!SESSAO)return null;if(Date.now()<SESSAO.exp-60000)return SESSAO.at;
 try{const r=await fetch(SBU+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},{apikey:SBK}),body:JSON.stringify({refresh_token:SESSAO.rt})});if(!r.ok)throw 0;const j=await r.json();
  SESSAO=Object.assign(SESSAO,{at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000});LS.set('sessao',SESSAO);return SESSAO.at}catch(e){SESSAO=null;LS.del('sessao');return null}}
function abrirLogin(motivo){abrirModal(`<div class="row between"><h2 class="h2">Entrar para avaliar</h2>${xBtn}</div>
 <p class="p mut">${esc(motivo||'Para evitar avaliações falsas, só quem tem conta pode avaliar.')} Enviamos um link de acesso para o seu e-mail, sem senha.</p>
 <form data-form="entrar" class="col" style="gap:.6rem"><label class="f">Seu e-mail<input class="inp" name="email" type="email" autocomplete="email" required placeholder="nome@exemplo.com"></label><button class="btn pri" style="flex:none">Enviar link de acesso</button></form>
 <span class="sm mut">Usamos o e-mail só para identificar sua conta. Ele não aparece para ninguém.</span>`,'Entrar')}
async function pedirLink(email){email=(email||'').trim();if(!/^\S+@\S+\.\S+$/.test(email)){toast('Confira o e-mail');return}
 try{const r=await fetch(SBU+'/auth/v1/otp?redirect_to='+encodeURIComponent(APP_URL),{method:'POST',headers:{'Content-Type':'application/json',apikey:SBK},body:JSON.stringify({email,create_user:true})});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.error_description||'erro')}
  fechar();toast('Pronto! Abra o link que enviamos para '+email+' neste aparelho.')}catch(e){toast('Não foi possível enviar agora: '+e.message)}}
function sairConta(){SESSAO=null;LS.del('sessao');toast('Você saiu da conta');render()}
document.addEventListener('submit',e=>{const F=e.target;if(F.dataset&&F.dataset.form==="entrar"){e.preventDefault();pedirLink(F.elements.email.value)}},true);
async function enviarAv(){const p=byId(AV.id);const its=Object.entries(AV.r).filter(([k,v])=>v!=='x');if(!its.length){toast('Marque pelo menos um item');return}
 const tk=await tokenValido();if(!tk){LS.set('av_pend',{id:AV.id,r:AV.r});abrirLogin();return}
 const rows=its.map(([k,v])=>({local_id:String(p.id),item:k,valor:v==='s'}));
 try{const r=await fetch(SBU+'/rest/v1/pax_avaliacoes?on_conflict=local_id,item,usuario',{method:'POST',headers:{'Content-Type':'application/json',apikey:SBK,Authorization:'Bearer '+tk,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
  if(!r.ok)throw 0;LS.set('av_'+p.id,AV.r);LS.del('av_pend');fechar();toast('Obrigado! Sua avaliação ajuda outras pessoas.')}catch(e){toast('Não foi possível enviar agora. Tente com internet.')}}
setTimeout(()=>{const pd=LS.get('av_pend',null);if(pd&&SESSAO){S.sel=pd.id;AV={id:pd.id,r:pd.r};try{ir('local');desenharAv(byId(pd.id))}catch(e){}}},1200);

/* ---------- Atendimento inclusivo: faixa no cadastro e ponto na prévia ---------- */
const INCL=SELO_GRUPOS[0][2];
function inclusivoDe(p){const ss=selosDe(p);return INCL.filter(([k])=>ss.includes(k)).map(([k,t])=>t)}
function faixaInclusiva(p){const it=inclusivoDe(p);if(!it.length)return'';return `<div class="faixa-incl" role="note"><span class="incl-dot" aria-hidden="true"></span><span><b>Atendimento Inclusivo:</b> ${esc(it.join(' · '))}. Confirmado por pessoas da comunidade.</span></div>`}
const _vLocal2=VIEWS.local;VIEWS.local=()=>{let h=_vLocal2();const p=byId(S.sel);if(!p)return h;const f=faixaInclusiva(p);if(!f)return h;
 const m=h.indexOf('id="galsc"');if(m>-1){let k=h.indexOf('</div>',m);const dots=h.indexOf('id="galdots"');if(dots>-1&&dots<k+40)k=h.indexOf('</div>',dots);return h.slice(0,k+6)+f+h.slice(k+6)}return f+h};
const _card=card,_mini=mini;
card=function(p){const h=_card(p);return inclusivoDe(p).length?h.replace('<span class="bdg">','<span class="incl-dot pin" title="Atendimento inclusivo" aria-label="Atendimento inclusivo"></span><span class="bdg">'):h};
mini=function(p){const h=_mini(p);return inclusivoDe(p).length?h.replace('<span class="bdg">','<span class="incl-dot pin" title="Atendimento inclusivo" aria-label="Atendimento inclusivo"></span><span class="bdg">'):h};

/* ---------- Notas do Google (gravadas pela função pax-google no Supabase) ---------- */
function aplicarGoogle(p,x){if(!p)return;if(x.google_place_id)p.gid=x.google_place_id;if(x.google_nota==null)return;const d=x.google_atualizado?new Date(x.google_atualizado).toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).replace('.',''):'';
 p.g={v:+x.google_nota,n:x.google_qtd||0,d,f:x.google_place_id?'https://www.google.com/maps/place/?q=place_id:'+x.google_place_id:undefined};if(x.google_place_id)p.gid=x.google_place_id}
(function(){if(typeof fetch!=='function')return;
 fetch(SBU+'/rest/v1/pax_locais?select=id,google_place_id,google_nota,google_qtd,google_atualizado&google_place_id=not.is.null',{headers:SBH}).then(r=>r.ok?r.json():[]).then(rs=>{(rs||[]).forEach(x=>aplicarGoogle(byId(+x.id),x))}).catch(()=>{});
 fetch(SBU+'/rest/v1/pax_extra?select=cnes,google_place_id,google_nota,google_qtd,google_atualizado&google_place_id=not.is.null&limit=5000',{headers:SBH}).then(r=>r.ok?r.json():[]).then(rs=>{const t=()=>{(rs||[]).forEach(x=>aplicarGoogle(byId(10000000+(+x.cnes)),x))};t();setTimeout(t,8000)}).catch(()=>{})})();
/* Botões Google Maps e Uber logo após a imagem (só links, sem cota) */
function ptDe(p){return {k:'unidade',id:p.id,n:p.n,e:p.e,la:p.la,lo:p.lo}}
function btnGmaps(href){return `<a class="btn-gm" href="${href}" target="_blank" rel="noopener" aria-label="Abrir no Google Maps"><img src="img/gmaps.png" alt="Google Maps" style="height:1.35rem;width:auto"></a>`}
function btnUber(href){return `<a class="btn-uber" href="${href}" target="_blank" rel="noopener" aria-label="Chamar um Uber"><img src="img/uber.png" alt="Uber" style="height:1.15rem;width:auto"></a>`}
function botoesMapa(p){if(isOnline(p)||p.la==null)return'';return `<div class="mapbtns">${btnGmaps(gplace(p))}${btnUber(uber(ptDe(p)))}</div>`}
const _vLocal3=VIEWS.local;VIEWS.local=()=>{const h=_vLocal3();const p=byId(S.sel);if(!p)return h;const k='<section class="sec" style="padding-top:1.2rem">';return h.replace(k,k+botoesMapa(p))};
window.paxLeaflet=()=>{if(document.querySelector('#modal [data-mapwait]'))mapaWA();if(document.querySelector('#app [data-mapwait]'))render()};
setTimeout(()=>{if(typeof window.L==='undefined'){const w=document.querySelector('[data-mapwait] .empty');if(w)w.textContent='O mapa precisa de internet. Use os botões do Google Maps.'}},9000);


/* ===== Fotos dos sites oficiais (pax_extra.foto_url) + página de remoção ===== */
(()=>{const SBU2='https://cckywhtpnjhlwqslmlxz.supabase.co',K2='sb_publishable_yv9jTgQHXV1Diy_xPkk_eg_qSt_8roq';
 const ap=rs=>(rs||[]).forEach(x=>{const p=byId(10000000+(+x.cnes));if(p&&!p.foto){p.foto=x.foto_url;p.fotoCred=x.foto_credito}});
 const c=LS.get('fotosx',null);if(c)ap(c);
 fetch(SBU2+'/rest/v1/pax_extra?select=cnes,foto_url,foto_credito&foto_url=not.is.null&limit=5000',{headers:{apikey:K2,Authorization:'Bearer '+K2}}).then(r=>r.ok?r.json():null).then(rs=>{if(!rs)return;LS.set('fotosx',rs);const t=()=>ap(rs);t();setTimeout(()=>{t();if(S.view==='local'||S.view==='home')render()},8000)}).catch(()=>{})})();
PGS.remocao=['Remover estabelecimento','Para responsáveis pelo local',()=>`<div class="card"><p class="p">O Pax reúne dados públicos (CNES, sites oficiais e fotos divulgadas pelos próprios estabelecimentos) para ajudar pacientes a encontrar e reconhecer o local.</p><p class="p">Se você é responsável por um estabelecimento e quer remover a foto ou o cadastro, envie o nome e o endereço do local. Retiramos em até 5 dias úteis.</p><a class="btn pri" href="mailto:${/@/.test(CFG.email)?CFG.email:''}?subject=${enc('Pax - Saúde: pedido de remoção')}&body=${enc('Estabelecimento:\nEndereço:\nRemover: ( ) só a foto  ( ) o cadastro inteiro\nSeu nome e cargo:')}">${I.mail('#fff',20)} Pedir remoção por e-mail</a></div>`];

/* ===== Conta do paciente na nuvem (Supabase pax_pacientes) ===== */
const PAC_SB='https://cckywhtpnjhlwqslmlxz.supabase.co',PAC_K='sb_publishable_yv9jTgQHXV1Diy_xPkk_eg_qSt_8roq';
function uidDe(at){try{return JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}}
const soDig=t=>String(t||'').replace(/\D/g,'');
let _ultSync='';
async function syncPaciente(){const u=S.user;if(!SESSAO||!u||!u.nome||soDig(u.cel).length<10)return;const k=u.nome+'|'+soDig(u.cel);if(k===_ultSync)return;
 const at=await tokenValido();if(!at)return;const id=uidDe(at);if(!id)return;
 try{const r=await fetch(PAC_SB+'/rest/v1/pax_pacientes?on_conflict=id',{method:'POST',headers:{apikey:PAC_K,Authorization:'Bearer '+at,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,nome:u.nome.trim().slice(0,120),telefone:soDig(u.cel).slice(-13),atualizado:new Date().toISOString()})});if(r.ok)_ultSync=k}catch(e){}}
function mascTel(t){const d=soDig(t);return d.length>=4?'•••• '+d.slice(-4):'—'}
function blocoConta(){if(!SESSAO)return `<div class="card"><b>Conta na nuvem</b><p class="p mut">Entre com seu e-mail para guardar seu nome e celular com segurança e usar em outros aparelhos.</p><button class="btn" data-act="pacEntrar">Entrar com e-mail</button></div>`;
 return `<div class="card"><b>Conta na nuvem</b><p class="p mut">Seu nome e celular ficam salvos na sua conta. Só você pode ver ou apagar esses dados.</p><button class="btn" data-act="pacApagar" style="color:#B3261E;border-color:#B3261E">${I.x('#B3261E',18)} Apagar meus dados da conta</button></div>`}
function confirmarApagar(){const u=S.user||{};abrirModal(`<div class="row between"><h2 class="h2">Apagar dados da conta?</h2>${xBtn}</div>
 <div class="info warn">${I.alert('#5E3B08',20)}<span>Esta ação <b>não pode ser desfeita</b>. Seu nome e o celular <b>${esc(mascTel(u.cel))}</b> serão apagados da nuvem do Pax. Avaliações que você fez continuam anônimas.</span></div>
 <form data-form="pacApagar" class="col" style="gap:.7rem"><label class="lbl">Para confirmar, digite os 4 últimos números do seu celular<input name="fim" inputmode="numeric" maxlength="4" required autocomplete="off" class="inp"></label>
 <button class="btn pri" type="submit" style="background:#B3261E;border-color:#B3261E">Sim, apagar meus dados</button><button type="button" class="btn" data-act="fechar">Cancelar</button></form>`)}
async function apagarPaciente(fim){const u=S.user||{};if(soDig(u.cel).slice(-4)!==fim){toast('Os números não conferem. Nada foi apagado.');return}
 const at=await tokenValido();const id=at&&uidDe(at);if(!id){toast('Entre na sua conta para apagar');return}
 try{const r=await fetch(PAC_SB+'/rest/v1/pax_pacientes?id=eq.'+id,{method:'DELETE',headers:{apikey:PAC_K,Authorization:'Bearer '+at,Prefer:'return=minimal'}});if(!r.ok)throw 0;_ultSync='';fechar();toast('Seus dados foram apagados da conta');render()}catch(e){toast('Não foi possível apagar agora. Tente de novo.')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;if(a==='pacApagar'){e.preventDefault();confirmarApagar()}else if(a==='pacEntrar'){e.preventDefault();abrirLogin('conta')}},true);
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&f.dataset.form==='pacApagar'){e.preventDefault();e.stopPropagation();apagarPaciente(soDig(new FormData(f).get('fim')))}},true);
if(VIEWS.perfil){const _vPerfil=VIEWS.perfil;VIEWS.perfil=()=>{setTimeout(syncPaciente,300);const h=_vPerfil();return h+`<section class="sec">${blocoConta()}</section>`}}
setTimeout(syncPaciente,3000);
/* ============ INÍCIO ============ */
(function(){try{history.replaceState({pax:'base'},'')}catch(e){}const v=location.hash.slice(1);S.view=['buscar','agenda','perfil','novo'].includes(v)?v:'inicio';S.navAt=S.view;render(true);gpsAuto(true)})();
